# ~/.tmux.conf

# --- General Configuration ---

# Set prefix key to 'C-a' (Ctrl-a) - more convenient than C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config with 'r'
bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.tmux.conf reloaded!"

# Enable mouse mode (scrolling, resizing panes, clicking to switch)
set-option -g mouse on
set -g default-terminal "tmux-256color"

# Set vi-style keys in copy mode
set-window-option -g mode-keys vi

# Start windows and panes at 1 instead of 0
set -g base-index 1
set-window-option -g pane-base-index 1

# History limit
set-option -g history-limit 10000

# Aggressive resize for clients
set-option -g aggressive-resize on

# Prevent tmux from overwriting names with commmand or path
set -g automatic-rename off
set -g allow-rename off

# --- Key Bindings (Sane Defaults) ---

# Split panes
bind | split-window -h -c "#{pane_current_path}" # horizontal split
bind - split-window -v -c "#{pane_current_path}" # vertical split

# Navigate panes with C-a + hjkl (like vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with C-a + HJKL
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Swap panes
bind-key > swap-pane -D # Move current pane to the right
bind-key < swap-pane -U # Move current pane to the left

# Kill pane/window
bind x kill-pane
bind X kill-window

# Copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# --- Plugins (using TPM - Tmux Plugin Manager) ---

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # sensible defaults for tmux
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after reboot
set -g @plugin 'tmux-plugins/tmux-continuum' # continuous saving of tmux environment

# Plugin specific settings
set -g @resurrect-dir '~/.config/tmux/resurrect' # where to save/restore sessions
set -g @continuum-restore 'on' # enable auto-restore

# Catppuccin Theme Plugin
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Catppuccin Theme Configuration 
# Choose your desired flavor: 'latte', 'frappe', 'macchiato', or 'mocha'
set -g @catppuccin_flavor 'frappe' 

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

set -g @catppuccin_window_status_enable "yes"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_status_icon_enable "yes"
set -g @catppuccin_icon_window_last "󰖰" # Nerd Font icon for last window
set -g @catppuccin_icon_window_current "󰖯" # Nerd Font icon for current window

# Use breadcrumbs: first-letter of each path segment
set -g @catppuccin_window_default_text "#{b:pane_current_path}"
set -g @catppuccin_window_current_text "#{b:pane_current_path}"

# Pane border styling
set -g @catppuccin_pane_border_style "fg=#{thm_mauve}" # Adjust to desired Catppuccin color
set -g @catppuccin_pane_active_border_style "fg=#{thm_green}" # Adjust to desired Catppuccin color

# }}}


# Initialize TPM. Keep this line at the very bottom of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'

